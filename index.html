<!doctype html>
<html lang="he" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#fffaf2">
  <title>רגע לפני שמתחילות | קפסולת פתיחה</title>
  <meta name="description" content="חוויה אישית קצרה לקראת פתיחת המחזור, קרן בן עמי | אמא מגשימה">
  <style>
    @font-face{font-family:Polin;src:url("fonts/polin-regular.woff2") format("woff2");font-weight:400;font-display:swap}
    @font-face{font-family:Polin;src:url("fonts/polin-bold.woff2") format("woff2");font-weight:700;font-display:swap}
    @font-face{font-family:Polin;src:url("fonts/polin-black.woff2") format("woff2");font-weight:900;font-display:swap}
    @font-face{font-family:Barlev;src:url("fonts/barlev-medium.woff2") format("woff2");font-weight:600;font-display:swap}
    @font-face{font-family:NotoBrand;src:url("fonts/noto-sans-hebrew-bold.ttf") format("truetype");font-weight:700;font-display:swap}
    :root{--paper:#f2e8da;--paper-light:#fbf7f0;--ink:#3b2b29;--muted:#6b5b55;--gold:#d7a85b;--line:rgba(59,43,41,.16);--shadow:0 24px 70px rgba(59,43,41,.14);--plum:#5d2848;--coral:#df6d59;--sun:#e7b95b}
    *{box-sizing:border-box}
    html{min-width:320px;background:var(--paper);color:var(--ink)}
    body{margin:0;min-height:100dvh;background:radial-gradient(circle at 86% 12%,rgba(231,185,91,.22),transparent 24%),radial-gradient(circle at 8% 68%,rgba(223,109,89,.13),transparent 27%),linear-gradient(155deg,#fffaf2,#f1e5dc);color:var(--ink);font-family:Polin,"Noto Sans Hebrew",Arial,sans-serif}
    button,input{font:inherit}
    button,.button-link{min-height:48px;border:0;border-radius:999px;padding:.78rem 1.2rem;cursor:pointer;transition:transform .18s ease,background .18s ease,box-shadow .18s ease,opacity .18s ease}
    button:hover,.button-link:hover{transform:translateY(-1px)}
    button:focus-visible,input:focus-visible,a:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
    button:disabled{opacity:.48;cursor:not-allowed;transform:none}
    a{color:inherit}
    .shell{min-height:100dvh;display:grid;grid-template-rows:auto 1fr auto}
    .brand-bar{display:flex;justify-content:space-between;align-items:center;gap:1rem;padding:16px clamp(16px,4vw,48px);border-bottom:1px solid var(--line);background:rgba(255,250,242,.82);backdrop-filter:blur(16px)}
    .brand-bar>div{display:flex;flex-direction:column;gap:2px}
    .brand-bar strong{font-family:NotoBrand,Polin,Arial,sans-serif;font-size:1rem}
    .brand-bar span,.brand-signature{color:var(--muted);font-size:.82rem}
    .brand-signature{font-family:NotoBrand,Polin,Arial,sans-serif}
    .stage{width:min(680px,100%);margin:0 auto;padding:clamp(18px,4vw,44px) 16px 40px}
    .shell>footer{text-align:center;color:var(--muted);font-size:.75rem;padding:16px calc(16px + env(safe-area-inset-right)) calc(16px + env(safe-area-inset-bottom)) calc(16px + env(safe-area-inset-left))}
    .beat{margin-bottom:9px;color:var(--plum);text-align:center;font-size:.76rem;font-weight:800}
    .scene{border:1px solid rgba(93,40,72,.14);border-top:4px solid rgba(223,109,89,.55);border-radius:32px;padding:clamp(22px,5vw,44px);background:rgba(255,252,247,.95);box-shadow:var(--shadow);animation:enter .45s ease both}
    .scene.center{text-align:center}
    .scene h1{font-family:Barlev,Polin,Arial,sans-serif;font-weight:600;font-size:clamp(2rem,7vw,4.5rem);line-height:1.02;letter-spacing:-.018em;margin:.45rem 0 1rem;color:var(--plum)}
    .kicker{color:var(--coral);font-size:.8rem;font-weight:900}
    .lead{font-size:clamp(1.05rem,2.7vw,1.28rem);line-height:1.65;color:var(--muted);max-width:35rem}
    .contract{display:grid;gap:5px;margin:1.4rem 0;padding:18px;border-radius:22px;background:#f1e2d4;line-height:1.5}
    .contract small,.permission{color:var(--muted)}
    .primary{background:var(--ink);color:white;text-decoration:none;display:inline-grid;place-items:center;font-weight:700}
    .secondary{background:transparent;color:var(--ink);border:1px solid var(--line)}
    .quiet{background:transparent;color:var(--muted)}
    .wide{width:100%}
    .arrival-list{display:grid;gap:8px;margin:1.2rem 0}
    .arrival-list button{min-height:62px;display:grid;grid-template-columns:16px 1fr;align-items:center;gap:10px;border:1px solid rgba(93,40,72,.15);border-radius:18px;background:#fffdf9;color:var(--ink);text-align:right}
    .arrival-list button i{width:9px;height:9px;border:2px solid var(--coral);border-radius:50%}
    .arrival-list button.selected{background:var(--plum);color:white;box-shadow:0 12px 30px rgba(93,40,72,.2)}
    .arrival-list button.selected i{background:var(--sun);border-color:var(--sun)}
    .field-reply,.camera-message,.saved-note,.reveal-note{margin:1rem 0;padding:14px 16px;border-radius:17px;background:rgba(231,185,91,.2);color:var(--plum);line-height:1.55}
    .text-field{display:block;margin:1.4rem 0}
    .text-field span{display:block;font-weight:700;margin-bottom:.55rem}
    .text-field input{width:100%;min-height:58px;border:1px solid var(--line);background:white;color:var(--ink);border-radius:16px;padding:14px 16px;font-size:1.05rem}
    .scene-nav{display:flex;justify-content:space-between;gap:10px;margin-top:1.4rem}
    .camera-prompt{padding:14px 16px;border-radius:18px;background:#f1e2d4;color:var(--plum);line-height:1.55}
    .camera{position:relative;width:min(380px,100%);aspect-ratio:4/5;margin:1rem auto;overflow:hidden;border-radius:30px;background:linear-gradient(145deg,#3b2632,var(--plum));box-shadow:0 22px 55px rgba(93,40,72,.22)}
    .camera video{width:100%;height:100%;object-fit:cover;transform:scaleX(-1)}
    .camera video[controls]{transform:none}
    .camera-cover{position:absolute;inset:0;display:grid;place-items:center;align-content:center;gap:8px;color:white;text-align:center}
    .camera-cover i{width:62px;height:62px;border:2px solid rgba(255,255,255,.72);border-radius:50%;box-shadow:inset 0 0 0 13px rgba(255,255,255,.08)}
    .camera-cover small{color:#e2ccd7}
    .recording-clock{position:absolute;top:14px;left:14px;padding:7px 11px;border-radius:999px;background:rgba(40,18,30,.75);color:white;direction:ltr;font-weight:900}
    .camera-controls{display:grid;grid-template-columns:1fr 1fr;gap:8px}
    .record-button{background:var(--coral);color:white;font-weight:900}
    .capsule-preview{width:min(380px,100%);min-height:220px;display:grid;place-items:center;align-content:center;gap:10px;margin:1rem auto;padding:25px;border-radius:48% 52% 42% 58%/55% 40% 60% 45%;background:linear-gradient(145deg,var(--plum),#7e3a5f);color:white;text-align:center;box-shadow:0 22px 55px rgba(93,40,72,.24)}
    .capsule-preview>span{font-size:2rem}
    .capsule-preview b{font-family:Barlev,Polin,Arial,sans-serif;font-size:clamp(1.6rem,5vw,2.5rem);font-weight:600}
    .capsule-preview small{color:#ead5e0}
    .hold-to-seal{position:relative;overflow:hidden;width:100%;min-height:64px;margin-top:10px;background:var(--coral);color:white;font-weight:900;user-select:none;touch-action:none}
    .hold-to-seal::before{content:"";position:absolute;inset:0;background:var(--plum);transform:scaleX(0);transform-origin:right;transition:transform 1.2s linear}
    .hold-to-seal.holding::before{transform:scaleX(1)}
    .hold-to-seal span{position:relative;z-index:1}
    .sealed-mark{width:180px;aspect-ratio:1;display:grid;place-items:center;margin:1rem auto;border:1px solid rgba(93,40,72,.18);border-radius:50%;background:radial-gradient(circle,rgba(223,109,89,.16) 0 28%,transparent 29% 48%,rgba(231,185,91,.16) 49% 67%,transparent 68%);color:var(--plum);font-size:2rem}
    .capsule-playback{width:min(420px,100%);display:block;margin:1rem auto;border-radius:28px;box-shadow:0 20px 50px rgba(93,40,72,.22)}
    .camera-fallback{min-height:180px;display:grid;place-items:center;margin:1rem 0;border-radius:24px;background:#f1e2d4;color:var(--muted)}
    .arrival-return{font-weight:800}
    .button-link{text-decoration:none;display:grid;place-items:center}
    .share-keepsake{display:grid;gap:12px;margin:1.2rem 0;padding:20px;border:1px solid rgba(93,40,72,.14);border-radius:26px;background:linear-gradient(145deg,#fff8ef,#f3e2d9);text-align:right}
    .share-keepsake h2{margin:0;color:var(--plum);font-family:Barlev,Polin,Arial,sans-serif;font-size:clamp(1.7rem,5vw,2.4rem);font-weight:600}
    .share-keepsake p{margin:0;color:var(--muted);line-height:1.55}
    .share-card-preview{min-height:210px;display:grid;place-items:center;align-content:center;gap:8px;padding:24px;border-radius:24px;background:radial-gradient(circle at 82% 18%,rgba(231,185,91,.28),transparent 28%),linear-gradient(145deg,#5d2848,#7e3a5f);color:white;text-align:center;box-shadow:0 18px 42px rgba(93,40,72,.2)}
    .share-card-preview small{color:#f2cedc;font-weight:700}.share-card-preview strong{font-family:Barlev,Polin,Arial,sans-serif;font-size:clamp(2.2rem,8vw,3.6rem);font-weight:600}.share-card-preview span{color:#f7e1c0}
    .share-actions{display:grid;grid-template-columns:1fr 1fr;gap:8px}.share-note{font-size:.8rem}.share-status{padding:10px 12px;border-radius:14px;background:rgba(231,185,91,.2);color:var(--plum);text-align:center;font-weight:700}
    .preview-badge{position:fixed;left:10px;bottom:10px;z-index:20;padding:6px 10px;border:1px solid rgba(93,40,72,.15);border-radius:999px;background:rgba(255,252,247,.88);color:var(--muted);font-size:.68rem;backdrop-filter:blur(8px);pointer-events:none}
    @keyframes enter{from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
    @media(max-width:700px){.brand-bar{align-items:flex-start;padding:12px 14px}.brand-bar>div span{max-width:210px}.brand-signature{text-align:left;max-width:120px}.stage{padding:12px 10px 28px}.scene{border-radius:24px;padding:22px 16px}.scene h1{font-size:clamp(2rem,10vw,3.1rem)}.scene-nav{position:sticky;bottom:calc(8px + env(safe-area-inset-bottom));padding-top:8px;background:linear-gradient(transparent,var(--paper-light) 28%);z-index:8}.scene-nav button{flex:1;min-width:0}.camera-controls,.share-actions{grid-template-columns:1fr}.camera{height:min(42vh,340px);aspect-ratio:auto}.preview-badge{display:none}}
    @media(max-width:360px){.brand-bar>div span{display:none}.scene{padding:18px 14px}.arrival-list button{font-size:.88rem}.scene-nav{gap:6px}}
    @media(max-width:700px) and (max-height:650px){.camera{height:30vh}}
    @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important;scroll-behavior:auto!important}}
  </style>
</head>
<body>
  <main class="shell">
    <header class="brand-bar">
      <div><strong>רגע לפני שמתחילות</strong><span id="subtitle">חוויה אישית לקראת פתיחת המחזור</span></div>
      <small class="brand-signature">קרן בן עמי | אמא מגשימה</small>
    </header>
    <section class="stage" id="app" aria-live="polite"></section>
    <footer>כל הזכויות שמורות © 2026, קרן בן עמי, אמא מגשימה</footer>
  </main>
  <div class="preview-badge">Preview אישי, נשמר רק במכשיר הזה</div>
  <script>
    (() => {
      const COPY = [
        {key:"spark",label:"ישששש, אני בפנים",reply:"כן. מותר לשמוח עוד לפני שהבנת הכול."},
        {key:"questions",label:"אני ומיליון השאלות שלי",reply:"הן יכולות לבוא. לא כולן צריכות תשובה היום."},
        {key:"calm",label:"אני רגועה. כאילו.",reply:"קלטנו את ה\"כאילו\". היא מוזמנת איתך."},
        {key:"messages",label:"לא קראתי את כל ההודעות",reply:"מעולה. זו לא בחינת קבלה. כבר התקבלת."}
      ];
      const TEXT_KEY="welcome-capsule:v1", VIDEO_KEY="opening-video";
      const app=document.querySelector("#app"), subtitle=document.querySelector("#subtitle");
      const state={step:0,draft:{arrival:"",intention:"",createdAt:""},blob:null,videoUrl:"",stream:null,recorder:null,chunks:[],timer:null,seconds:20,message:"",shareMessage:"",sealed:false,reveal:new URLSearchParams(location.search).get("reveal")==="1",opened:false,hold:null};
      try{const saved=localStorage.getItem(TEXT_KEY);if(saved){state.draft=JSON.parse(saved);state.sealed=true}}catch{}

      function openDb(){return new Promise((resolve,reject)=>{const req=indexedDB.open("welcome-capsule",1);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains("capsules"))req.result.createObjectStore("capsules")};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error)})}
      async function writeVideo(blob){if(!blob)return;const db=await openDb();await new Promise((resolve,reject)=>{const tx=db.transaction("capsules","readwrite");tx.objectStore("capsules").put(blob,VIDEO_KEY);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}
      async function readVideo(){const db=await openDb();const blob=await new Promise((resolve,reject)=>{const req=db.transaction("capsules","readonly").objectStore("capsules").get(VIDEO_KEY);req.onsuccess=()=>resolve(req.result||null);req.onerror=()=>reject(req.error)});db.close();return blob}
      function setBlob(blob){if(state.videoUrl)URL.revokeObjectURL(state.videoUrl);state.blob=blob;state.videoUrl=blob?URL.createObjectURL(blob):""}
      function esc(value){return String(value||"").replace(/[&<>'"]/g,ch=>({"&":"&amp;","<":"&lt;",">":"&gt;","'":"&#39;",'"':"&quot;"}[ch]))}
      function scene(kicker,title,body,center=false){return `<div class="scene${center?" center":""}"><span class="kicker">${kicker}</span><h1>${title}</h1>${body}</div>`}
      function nav(back,next,nextText,disabled=false){return `<nav class="scene-nav"><button class="secondary" data-action="${back}">חזרה</button><button class="primary" data-action="${next}"${disabled?" disabled":""}>${nextText}</button></nav>`}
      function arrival(){return COPY.find(item=>item.key===state.draft.arrival)}
      function stopCamera(){if(state.stream)state.stream.getTracks().forEach(track=>track.stop());state.stream=null;if(state.timer)clearInterval(state.timer);state.timer=null}
      function scrollTop(){window.scrollTo({top:0,behavior:matchMedia("(prefers-reduced-motion: reduce)").matches?"auto":"smooth"})}
      function downloadBlob(blob,name){const url=URL.createObjectURL(blob),link=document.createElement("a");link.href=url;link.download=name;document.body.appendChild(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),1000)}
      function blobToDataUrl(blob){return new Promise((resolve,reject)=>{if(!blob){resolve("");return}const reader=new FileReader();reader.onload=()=>resolve(String(reader.result||""));reader.onerror=()=>reject(reader.error);reader.readAsDataURL(blob)})}
      function roundedRect(ctx,x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.lineTo(x+w-r,y);ctx.quadraticCurveTo(x+w,y,x+w,y+r);ctx.lineTo(x+w,y+h-r);ctx.quadraticCurveTo(x+w,y+h,x+w-r,y+h);ctx.lineTo(x+r,y+h);ctx.quadraticCurveTo(x,y+h,x,y+h-r);ctx.lineTo(x,y+r);ctx.quadraticCurveTo(x,y,x+r,y);ctx.closePath()}
      async function createStartCard(){await document.fonts.ready;const canvas=document.createElement("canvas");canvas.width=1080;canvas.height=1350;const ctx=canvas.getContext("2d");const gradient=ctx.createLinearGradient(0,0,1080,1350);gradient.addColorStop(0,"#fff8ef");gradient.addColorStop(1,"#efdcd4");ctx.fillStyle=gradient;ctx.fillRect(0,0,1080,1350);ctx.fillStyle="rgba(231,185,91,.22)";ctx.beginPath();ctx.arc(870,180,230,0,Math.PI*2);ctx.fill();ctx.fillStyle="rgba(223,109,89,.13)";ctx.beginPath();ctx.arc(120,1050,290,0,Math.PI*2);ctx.fill();roundedRect(ctx,82,82,916,1186,62);ctx.fillStyle="#fffaf4";ctx.fill();ctx.strokeStyle="rgba(223,109,89,.5)";ctx.lineWidth=8;ctx.stroke();ctx.textAlign="center";ctx.direction="rtl";ctx.fillStyle="#df6d59";ctx.font="900 34px Polin, Arial";ctx.fillText("רגע לפני שמתחילות",540,250);ctx.fillStyle="#5d2848";ctx.font="600 118px Barlev, Polin, Arial";ctx.fillText("אני בפנים.",540,500);ctx.font="600 72px Barlev, Polin, Arial";ctx.fillText("כמו שאני.",540,600);ctx.fillStyle="#e7b95b";ctx.font="700 48px Polin, Arial";ctx.fillText("✦",540,730);ctx.fillStyle="#5d2848";ctx.font="700 42px Polin, Arial";ctx.fillText(arrival()?.label||"הגעתי",540,850);ctx.fillStyle="#6b5b55";ctx.font="700 28px NotoBrand, Polin, Arial";ctx.fillText("קרן בן עמי | אמא מגשימה",540,1080);ctx.font="400 21px Polin, Arial";ctx.fillText("כל הזכויות שמורות © 2026, קרן בן עמי, אמא מגשימה",540,1160);return new Promise(resolve=>canvas.toBlob(resolve,"image/png",.96))}
      async function shareStartCard(){state.shareMessage="";try{const card=await createStartCard();if(!card)throw new Error("card");const file=new File([card],"אני-בפנים.png",{type:"image/png"});if(navigator.share&&navigator.canShare?.({files:[file]})){await navigator.share({title:"רגע לפני שמתחילות",text:"אני בפנים. כמו שאני. ✦",files:[file]});state.shareMessage="נשלח ממך. בדיוק במידה שבחרת."}else{downloadBlob(card,"אני-בפנים.png");state.shareMessage="הגלויה ירדה למכשיר. עכשיו אפשר לצרף אותה לקבוצת הוואטסאפ."}}catch(error){if(error?.name!=="AbortError")state.shareMessage="לא הצלחנו לפתוח שיתוף. אפשר להוריד את הגלויה ולצרף אותה לקבוצה."}render()}
      async function downloadCapsule(){state.shareMessage="";try{const videoData=await blobToDataUrl(state.blob);const privateHtml=`<!doctype html><html lang="he" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>קפסולת ההתחלה שלי</title><style>body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;background:#f2e8da;color:#3b2b29;font-family:Arial,sans-serif}.card{width:min(620px,100%);padding:36px;border-radius:32px;background:#fffaf4;box-shadow:0 20px 60px #5d284822;text-align:center}h1{color:#5d2848;font-size:clamp(2.2rem,8vw,4rem)}blockquote{margin:24px 0;padding:24px;border-radius:22px;background:#f1e2d4;color:#5d2848;font-size:1.35rem;font-weight:bold}video{width:100%;border-radius:24px}small{display:block;margin-top:26px;color:#6b5b55}</style><main class="card"><p>נשמר ביום ${new Date(state.draft.createdAt||Date.now()).toLocaleDateString("he-IL")}</p><h1>${esc(state.draft.intention)||"כוונה שלא חייבת עדיין מילים"}</h1><blockquote>✦ ${esc(arrival()?.label||"הרגע שבו הסכמתי להתחיל")}</blockquote>${videoData?`<video src="${videoData}" controls playsinline></video>`:"<p>נשמרה הכוונה, בלי סרטון.</p>"}<small>כל הזכויות שמורות © 2026, קרן בן עמי, אמא מגשימה</small></main></html>`;downloadBlob(new Blob([privateHtml],{type:"text/html;charset=utf-8"}),"קפסולת-ההתחלה-שלי.html");state.shareMessage="הקפסולה הפרטית ירדה למכשיר. היא שלך, ואין צורך לשתף אותה."}catch{state.shareMessage="ההורדה לא הצליחה בדפדפן הזה. הקפסולה עדיין שמורה כאן במכשיר."}render()}

      function render(){
        subtitle.textContent=state.reveal?"קפסולת הזמן שלך":"חוויה אישית לקראת פתיחת המחזור";
        if(state.reveal)return renderReveal();
        const beat=state.step>0&&state.step<4?`<div class="beat">פעימה ${state.step} מתוך 3</div>`:"";
        let html="";
        if(state.step===0)html=scene("ברוכה הבאה. את בפנים.","אפשר לשחרר<br>את הבטן.",`<p class="lead">עד שנתחיל באמת, נשמור כאן הודעה קטנה ממך לזאת שתסיים.</p><div class="contract"><b>ארבע דקות, גג.</b><span>אין תשובה נכונה. המצלמה לבחירתך. הקפסולה האישית לא מוצגת לקבוצה.</span><small>היא נשמרת בדפדפן ובמכשיר הזה. בסיום תוכלי גם להוריד עותק פרטי.</small></div><button class="primary wide" data-action="begin">יאללה, בואי נשמור אותי</button>`);
        if(state.step===1){const selected=arrival();html=scene("איך נכנסת בדלת","בלי להיות<br>מרשימה לרגע.",`<div class="arrival-list">${COPY.map(item=>`<button class="${state.draft.arrival===item.key?"selected":""}" data-arrival="${item.key}" aria-pressed="${state.draft.arrival===item.key}"><i aria-hidden="true"></i><b>${item.label}</b></button>`).join("")}</div>${selected?`<div class="field-reply">${selected.reply}</div>`:""}${nav("step0","step2","לשים כוונה",!selected)}`)}
        if(state.step===2)html=scene("לאן הלב שלך מציץ","בלי תוכנית עבודה.<br>רק כיוון קטן.",`<label class="text-field"><span>כשאסיים את המחזור, אני רוצה לפגוש בי...</span><input id="intention" maxlength="90" value="${esc(state.draft.intention)}" placeholder="יותר חופש, קול, ביטחון, רכות, אומץ..."></label><p class="permission">אפשר גם להשאיר ריק. כוונה היא לא חוזה.</p>${nav("step1","step3","להקליט לזאת שתסיים")}`);
        if(state.step===3)html=scene("עשרים שניות ממך","תסתכלי עלייך.<br>לא על המצלמה.",`<p class="camera-prompt">תגידי לזאת שתסיים: ״היי, זאת אני מההתחלה. אני רוצה שתזכרי...״</p><div class="camera">${state.videoUrl?`<video src="${state.videoUrl}" controls playsinline></video>`:`<video id="preview" muted playsinline></video>`}${!state.stream&&!state.videoUrl?`<div class="camera-cover"><i></i><b>המצלמה סגורה</b><small>היא תיפתח רק אחרי שתבחרי</small></div>`:""}${state.recorder?`<span class="recording-clock">● ${state.seconds}</span>`:""}</div>${state.message?`<p class="camera-message">${state.message}</p>`:""}<div class="camera-controls">${!state.stream&&!state.videoUrl?`<button class="primary" data-action="camera">לפתוח מצלמה</button>`:""}${state.stream&&!state.recorder?`<button class="record-button" data-action="record">להקליט 20 שניות</button>`:""}${state.recorder?`<button class="record-button" data-action="finish">סיימתי לפני הזמן</button>`:""}${state.videoUrl?`<button class="secondary" data-action="retake">לצלם שוב</button>`:""}<button class="quiet" data-action="step4">${state.videoUrl?"להמשיך עם הסרטון":"להמשיך בלי צילום"}</button></div><button class="quiet wide" data-action="step2">חזרה לכוונה</button>`);
        if(state.step===4&&!state.sealed)html=scene("הקפסולה מוכנה","לא מתקנות.<br>שומרות.",`<div class="capsule-preview"><span>✦</span><b>${esc(state.draft.intention)||"כוונה שלא חייבת עדיין מילים"}</b><small>${state.blob?"יש בפנים גם הודעת וידאו":"יש בפנים את הרגע הזה"}</small></div><p>בסוף המחזור נחזיר אותה אלייך. לא כדי לבדוק אם הצלחת, אלא כדי שתפגשי את מי שהסכימה להתחיל.</p><button class="hold-to-seal" data-action="hold"><span>החזיקי כדי לשמור במכשיר הזה</span></button>`);
        if(state.step===4&&state.sealed)html=scene("נשמר. באמת.","היא תחכה לך<br>כאן בסוף.",`<div class="sealed-mark">✦</div><p>עכשיו את לא צריכה להתכונן להיות מישהי. רק להגיע.</p><div class="saved-note">הקפסולה האישית שמורה בדפדפן ובמכשיר הזה. כדי שהיא תישאר איתך גם אם תחליפי מכשיר, הורידי עותק פרטי.</div><div class="share-keepsake"><span class="kicker">משהו קטן שאפשר להביא לקבוצה</span><h2>הקפסולה פרטית.<br>סימן ההתחלה משותף.</h2><div class="share-card-preview"><small>רגע לפני שמתחילות</small><strong>אני בפנים.</strong><span>${esc(arrival()?.label||"כמו שאני")}</span></div><p>הגלויה לא כוללת את הכוונה או את הסרטון שלך. רק את הרגע שבו אמרת: אני כאן.</p><div class="share-actions"><button class="primary" data-action="share-card">לשתף בקבוצת הוואטסאפ</button><button class="secondary" data-action="download-card">להוריד את הגלויה</button></div><button class="quiet wide" data-action="download-capsule">להוריד את הקפסולה הפרטית לעצמי</button>${state.shareMessage?`<div class="share-status" role="status">${esc(state.shareMessage)}</div>`:""}</div><a class="secondary button-link" href="?reveal=1">בדיקת ההפתעה של סוף המחזור</a>`,true);
        app.innerHTML=beat+html;bind();scrollTop();
        if(state.step===3&&state.stream){const video=document.querySelector("#preview");if(video){video.srcObject=state.stream;video.play().catch(()=>{})}}
      }

      function renderReveal(){
        let html;
        if(!state.sealed)html=scene("הקפסולה לא במכשיר הזה","פתחת אותה<br>במקום אחר?","<p>הקפסולה נשמרת בדפדפן ובמכשיר שבו נוצרה. אם הורדת עותק פרטי, היא מחכה לך בקבצים שלך.</p>");
        else if(!state.opened)html=scene("מההתחלה, אלייך של עכשיו","מישהי השאירה לך<br>משהו בדרך.",`<div class="sealed-mark">✦</div><p>זאת היית את.</p><button class="primary wide" data-action="open">לפתוח את הקפסולה</button>`,true);
        else html=scene("נשמר ביום שהתחלת",esc(state.draft.intention)||"הגעת גם בלי לדעת בדיוק איך זה ייראה.",`${state.videoUrl?`<video class="capsule-playback" src="${state.videoUrl}" controls playsinline></video>`:`<div class="camera-fallback">לא נשמר סרטון, ונשמרה הכוונה.</div>`}<p class="arrival-return">✦ ${arrival()?arrival().label:"הרגע שבו הסכמת להתחיל"}</p><p class="reveal-note">לא כדי לבדוק אם עמדת ביעד. כדי לראות את מי שהיית כשעוד לא ידעת מה יקרה.</p>`,true);
        app.innerHTML=html;bind();scrollTop();
      }

      async function startCamera(){state.message="";if(!navigator.mediaDevices?.getUserMedia||typeof MediaRecorder==="undefined"){state.message="המצלמה לא זמינה בדפדפן הזה. אפשר להמשיך בלי צילום.";render();return}try{state.stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:"user"},audio:true});render()}catch{state.stream=null;state.message="המצלמה נשארה סגורה. הכול בסדר, אפשר לדלג בלי הסבר.";render()}}
      function startRecording(){if(!state.stream)return;state.chunks=[];const recorder=new MediaRecorder(state.stream);state.recorder=recorder;recorder.ondataavailable=e=>{if(e.data.size)state.chunks.push(e.data)};recorder.onstop=()=>{setBlob(new Blob(state.chunks,{type:recorder.mimeType||"video/webm"}));state.recorder=null;render()};recorder.start();state.seconds=20;state.timer=setInterval(()=>{state.seconds-=1;if(state.seconds<=0)finishRecording();else render()},1000);render()}
      function finishRecording(){if(state.timer)clearInterval(state.timer);state.timer=null;if(state.recorder?.state==="recording")state.recorder.stop();stopCamera()}
      async function save(){const next={...state.draft,createdAt:new Date().toISOString()};try{localStorage.setItem(TEXT_KEY,JSON.stringify(next));await writeVideo(state.blob)}catch{}state.draft=next;state.sealed=true;render()}
      function bind(){
        document.querySelectorAll("[data-arrival]").forEach(btn=>btn.addEventListener("click",()=>{state.draft.arrival=btn.dataset.arrival;render()}));
        const input=document.querySelector("#intention");if(input)input.addEventListener("input",e=>{state.draft.intention=e.target.value});
        document.querySelectorAll("[data-action]").forEach(btn=>{
          const action=btn.dataset.action;
          if(action==="hold"){
            const begin=e=>{e.preventDefault();btn.classList.add("holding");state.hold=setTimeout(()=>{state.hold=null;save()},1200)};
            const cancel=()=>{btn.classList.remove("holding");if(state.hold)clearTimeout(state.hold);state.hold=null};
            btn.addEventListener("pointerdown",begin);btn.addEventListener("pointerup",cancel);btn.addEventListener("pointerleave",cancel);btn.addEventListener("pointercancel",cancel);btn.addEventListener("keydown",e=>{if(e.key==="Enter"||e.key===" "){e.preventDefault();save()}});return;
          }
          btn.addEventListener("click",()=>handle(action));
        });
      }
      function handle(action){
        if(action==="begin"){state.sealed=false;state.step=1;render()}
        if(action?.startsWith("step")){if(state.recorder?.state==="recording")finishRecording();else stopCamera();state.step=Number(action.slice(4));render()}
        if(action==="camera")startCamera();
        if(action==="record")startRecording();
        if(action==="finish")finishRecording();
        if(action==="retake"){setBlob(null);startCamera()}
        if(action==="open"){state.opened=true;render()}
        if(action==="share-card")shareStartCard();
        if(action==="download-card")createStartCard().then(card=>{if(card){downloadBlob(card,"אני-בפנים.png");state.shareMessage="הגלויה ירדה למכשיר."}else state.shareMessage="לא הצלחנו ליצור את הגלויה בדפדפן הזה.";render()});
        if(action==="download-capsule")downloadCapsule();
      }
      readVideo().then(blob=>{if(blob)setBlob(blob);render()}).catch(render);
    })();
  </script>
</body>
</html>
